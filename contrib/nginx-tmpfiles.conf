# Install to /etc/tmpfiles.d/nginx-ccaches.conf
#
# auth_gss_deleg_ccache_dir writes one FILE ccache per delegating principal
# and never removes them. The age field below has systemd-tmpfiles --clean
# (run periodically by systemd-tmpfiles-clean.timer) remove ccache files
# older than this. 1d is just an example: tune it to your deployment, e.g.
# how long delegated credentials should remain available between visits.
d /var/lib/krb5_deleg_caches  0750 www-data www-data 1d
